<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="6%" y1="8%" x2="90%" y2="92%">
      <stop offset="0%" stop-color="#2FC7F4"/>
      <stop offset="28%" stop-color="#3B6CF0"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="76%" stop-color="#EC4899"/>
